services:
  postgres:
    image: postgres:16-alpine
    container_name: meti-booking-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: meti
      POSTGRES_PASSWORD: meti
      POSTGRES_DB: meti_booking
    volumes:
      - meti_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meti -d meti_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meti_postgres_data:
