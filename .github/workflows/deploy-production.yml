name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Verify GitHub secrets
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          missing=0
          if [ -z "$PRODUCTION_HOST" ]; then echo "::error::Missing secret PRODUCTION_HOST"; missing=1; fi
          if [ -z "$PRODUCTION_USER" ]; then echo "::error::Missing secret PRODUCTION_USER"; missing=1; fi
          if [ -z "$PRODUCTION_SSH_KEY" ]; then echo "::error::Missing secret PRODUCTION_SSH_KEY"; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "One-time setup on the server:"
            echo "  ssh root@YOUR_SERVER_IP"
            echo "  cd ~/meti-booking && ./deploy/setup-cicd.sh"
            echo ""
            echo "Then add the 3 printed values here:"
            echo "  https://github.com/panagiod/meti-booking/settings/secrets/actions"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            echo "CI deploy commit ${{ github.sha }}"

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployed commit ${{ github.sha }} to production."
          echo "Site: https://meti-pilates.com"

      - name: Queue encrypted backup
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backup-production.yml --ref main
