name: Rebuild Production

on:
  workflow_dispatch:
    inputs:
      backup_day:
        description: "latest or YYYY-MM-DD"
        required: true
        default: latest
      confirm:
        description: "Type REBUILD to install the app on the recovery VPS and restore data"
        required: true

concurrency:
  group: production-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Install on a new VPS and restore from the private ops repo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Confirm rebuild
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "REBUILD" ]; then
            echo "::error::Type REBUILD in the confirm box. This installs on RECOVERY_HOST, not the current live IP unless you set them the same."
            exit 1
          fi

      - name: Verify recovery secrets
        env:
          RECOVERY_HOST: ${{ secrets.RECOVERY_HOST }}
          RECOVERY_USER: ${{ secrets.RECOVERY_USER }}
          RECOVERY_SSH_KEY: ${{ secrets.RECOVERY_SSH_KEY }}
          OPS_REPO_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          missing=0
          if [ -z "$RECOVERY_HOST" ]; then echo "::error::Missing RECOVERY_HOST (new VPS IPv4)"; missing=1; fi
          if [ -z "$RECOVERY_USER" ]; then echo "::error::Missing RECOVERY_USER (usually root)"; missing=1; fi
          if [ -z "$RECOVERY_SSH_KEY" ]; then echo "::error::Missing RECOVERY_SSH_KEY (unrestricted key on the new VPS)"; missing=1; fi
          if [ -z "$OPS_REPO_TOKEN" ]; then echo "::error::Missing OPS_REPO_TOKEN"; missing=1; fi
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then echo "::error::Missing BACKUP_ENCRYPTION_KEY"; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "See deploy/OPS.md in the public repo."
            exit 1
          fi

      - name: Checkout app scripts
        uses: actions/checkout@v4

      - name: Rebuild over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.RECOVERY_HOST }}
          username: ${{ secrets.RECOVERY_USER }}
          key: ${{ secrets.RECOVERY_SSH_KEY }}
          port: 22
          command_timeout: 50m
          envs: OPS_REPO,OPS_REPO_TOKEN,BACKUP_ENCRYPTION_KEY,BACKUP_DAY
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v git >/dev/null 2>&1; then
              apt-get update
              apt-get install -y git curl ca-certificates
            fi
            export OPS_REPO="${OPS_REPO:-panagiod/meti-studio-ops}"
            APP_DIR="${HOME}/meti-booking"
            if [[ ! -d "${APP_DIR}/.git" ]]; then
              git clone https://github.com/panagiod/meti-booking.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/*.sh
            CONFIRM=REBUILD ./deploy/bootstrap-from-ops.sh "${BACKUP_DAY:-latest}"
        env:
          OPS_REPO: ${{ secrets.OPS_REPO }}
          OPS_REPO_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_DAY: ${{ inputs.backup_day }}
